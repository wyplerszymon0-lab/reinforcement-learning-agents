# Hyperparameter reference for CartPole and LunarLander experiments.
# These are the exact values used in the training scripts.

dqn:
  cartpole:
    hidden_dims: [256, 256]
    lr: 1.0e-4
    gamma: 0.99
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay_steps: 100000
    buffer_capacity: 50000
    batch_size: 64
    target_update_freq: 250
    dueling: true
    double_dqn: true
    train_freq: 4          # one gradient step per 4 env steps; every step oscillates and collapses
    total_timesteps: 600000

  lunarlander:
    hidden_dims: [256, 256]
    lr: 5.0e-4
    gamma: 0.99
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay_steps: 100000
    buffer_capacity: 100000
    batch_size: 64
    target_update_freq: 1000
    dueling: true
    double_dqn: true
    total_timesteps: 500000

ppo:
  cartpole:
    hidden_dims: [64, 64]
    lr: 2.5e-4
    gamma: 0.99
    gae_lambda: 0.95
    clip_coef: 0.2
    vf_coef: 0.5
    ent_coef: 0.01
    num_steps: 512
    num_minibatches: 8
    update_epochs: 10
    total_timesteps: 500000

  lunarlander:
    hidden_dims: [64, 64]
    lr: 3.0e-4
    gamma: 0.999
    gae_lambda: 0.98
    clip_coef: 0.2
    vf_coef: 0.5
    ent_coef: 0.005        # was 0.01
    # Issue #2: until v1.0.0 this was 1 env, num_steps 1024, num_minibatches 4,
    # ent_coef 0.01, value clipping on, 1M steps: solved 1 of 3 seeds. Changed,
    # one at a time (results/RESULTS.md, "Tuning history"):
    #   1. RL Baselines3 Zoo batch: 16 envs x 1,024 steps per update (16,384
    #      transitions) in minibatches of 64        -> 0/3, plateau ~100
    #   2. clip_vloss false                          -> 0/3, but greedy eval > 200 on all
    #   3. ent_coef 0.01 -> 0.005                    -> 2/3
    #   4. total_timesteps 1M -> 2M                  -> 3/3, solved at 659k-828k steps
    num_envs: 16
    num_steps: 16384       # per update, across all envs (1,024 per env)
    num_minibatches: 256   # 64 transitions each
    update_epochs: 4
    clip_vloss: false      # returns are in the hundreds; a +-0.2 value clip starves the critic
    total_timesteps: 2000000  # a budget: the learning rate decays over it; solved seeds stop early
