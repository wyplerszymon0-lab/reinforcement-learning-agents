# Hyperparameter reference for CartPole and LunarLander experiments.
# These are the exact values used in the training scripts.

dqn:
  cartpole:
    hidden_dims: [256, 256]
    lr: 1.0e-4
    gamma: 0.99
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay_steps: 50000
    buffer_capacity: 50000
    batch_size: 64
    target_update_freq: 500
    dueling: true
    double_dqn: true
    total_timesteps: 200000

  lunarlander:
    hidden_dims: [256, 256]
    lr: 5.0e-4
    gamma: 0.99
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay_steps: 100000
    buffer_capacity: 100000
    batch_size: 64
    target_update_freq: 1000
    dueling: true
    double_dqn: true
    total_timesteps: 500000

ppo:
  cartpole:
    hidden_dims: [64, 64]
    lr: 2.5e-4
    gamma: 0.99
    gae_lambda: 0.95
    clip_coef: 0.2
    vf_coef: 0.5
    ent_coef: 0.01
    num_steps: 512
    num_minibatches: 8
    update_epochs: 10
    total_timesteps: 500000

  lunarlander:
    hidden_dims: [64, 64]
    lr: 3.0e-4
    gamma: 0.999
    gae_lambda: 0.98
    clip_coef: 0.2
    vf_coef: 0.5
    ent_coef: 0.01
    num_steps: 1024
    num_minibatches: 4
    update_epochs: 4
    total_timesteps: 1000000
