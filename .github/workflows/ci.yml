name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y swig
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "gymnasium[box2d]>=1.0" numpy matplotlib pyyaml imageio tensorboard pytest mypy
      - name: Test
        run: pytest -q
      - name: Type check
        run: mypy
