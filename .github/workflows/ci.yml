name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y swig
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "gymnasium[box2d]>=1.0" numpy matplotlib pyyaml imageio pytest mypy types-PyYAML
      - name: Type check
        run: mypy src scripts
      - name: Test
        run: pytest -q
